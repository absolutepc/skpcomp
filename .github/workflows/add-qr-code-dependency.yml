name: Add local QR encoder to feature branch

# One-shot dependency lockfile generation. No deployment or database changes.
on:
  push:
    branches:
      - feature/vercel-admin-qr-passkeys
    paths:
      - '.github/workflows/add-qr-code-dependency.yml'

permissions:
  contents: write

jobs:
  add-dependency:
    if: github.repository == 'absolutepc/skpcomp'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile
      - name: Add locally executed QR encoder and TypeScript definitions
        run: |
          pnpm add --save-exact 'qrcode@1.5.4'
          pnpm add -D --save-exact '@types/qrcode@1.5.6'
      - name: Validate lockfile
        run: pnpm install --frozen-lockfile
      - name: Commit dependency files to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet || git commit -m 'Add local QR code encoder with locked dependencies'
          git push origin HEAD:feature/vercel-admin-qr-passkeys
