name: Admin QR security checks

on:
  push:
    branches:
      - feature/vercel-admin-qr-passkeys
    paths:
      - 'lib/admin-*.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'lib/vercel-admin-session.ts'
      - 'db/admin-passkey-schema.sql'
      - 'scripts/test-admin-*.mjs'
      - '.github/workflows/admin-qr-security.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'lib/admin-*.ts'
      - 'lib/vercel-admin-session.ts'
      - 'db/admin-passkey-schema.sql'
      - 'scripts/test-admin-*.mjs'

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check QR challenge foundations
        run: node scripts/test-admin-passkey-foundation.mjs
      - name: Check admin sessions
        run: node scripts/test-vercel-admin-session-foundation.mjs
      - name: Check PostgreSQL schema
        run: node scripts/test-admin-qr-schema.mjs
      - name: Check QR URL handling
        run: node scripts/test-admin-qr-url.mjs
      - name: Check QR decision persistence
        run: node scripts/test-admin-qr-decision.mjs
      - name: Check QR persistence helpers
        run: node scripts/test-admin-qr-persistence.mjs
      - name: Check WebAuthn cryptographic verification integration
        run: node scripts/test-admin-passkey-verify.mjs
      - name: Check Passkey management persistence
        run: node scripts/test-admin-passkey-management.mjs
      - name: Check Passkey enrollment persistence
        run: node scripts/test-admin-passkey-enrollment-store.mjs
      - name: Check Passkey credential storage
        run: node scripts/test-admin-passkey-credentials.mjs
      - name: Check WebAuthn challenge handling
        run: node scripts/test-admin-webauthn-challenges.mjs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit

  vercel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Vercel production build (no deployment)
        run: pnpm build:vercel
