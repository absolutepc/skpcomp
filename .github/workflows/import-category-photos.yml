name: Import supplied SKP category photographs
on:
  push:
    branches: [feat/home-category-user-photos]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy the three uploaded category images into SKP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl -fLsS --retry 3 --retry-delay 1 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3HULPtDOfW9BAJwatGChaRfk15r/d886f55c-9aa7-43bf-a0f8-132312730b83.jpg' \
            -o public/images/category-laptops.jpg
          curl -fLsS --retry 3 --retry-delay 1 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3HULPtDOfW9BAJwatGChaRfk15r/6ce5f2ee-4215-45fe-91f2-235627277b34.webp' \
            -o public/images/category-components.webp
          curl -fLsS --retry 3 --retry-delay 1 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3HULPtDOfW9BAJwatGChaRfk15r/479909b5-16d6-4a2e-8c81-71ecde0f5efb.jpg' \
            -o public/images/category-peripherals.jpg
          for picture in public/images/category-{laptops.jpg,components.webp,peripherals.jpg}; do
            test -s "$picture"
            file "$picture"
          done
          test "$(file --mime-type -b public/images/category-laptops.jpg)" = image/jpeg
          test "$(file --mime-type -b public/images/category-components.webp)" = image/webp
          test "$(file --mime-type -b public/images/category-peripherals.jpg)" = image/jpeg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/category-laptops.jpg public/images/category-components.webp public/images/category-peripherals.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Import approved SKP category images'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
