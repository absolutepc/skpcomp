name: Verify SKP configurator

on:
  push:
    branches:
      - main
      - feat/configurator-compatibility-power-saved-builds
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit --incremental false
      - name: Model tests
        run: |
          pnpm test:configurator
          node scripts/test-cpu-presets.mjs
          pnpm test:fps
          pnpm test:gallery
          pnpm test:hero
          pnpm test:orders
          pnpm test:admin
          pnpm test:monitor
          pnpm test:logitech
          pnpm test:categories
          node scripts/test-product-brands.mjs
          node scripts/test-comparison.mjs
      - name: Production build
        run: pnpm build
