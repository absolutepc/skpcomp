name: Import submitted SKP build photo
on:
  push:
    branches: [feat/hero-user-skp-build-image]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Save exact owner-uploaded SKP build PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl -fL --retry 3 --retry-delay 1 'https://d2ol7oe51mr4n9.cloudfront.net/user_3HULPtDOfW9BAJwatGChaRfk15r/1e984dad-e0ab-4913-a730-7e3b2b5425e5.png' -o public/images/skp-build-hero.png
          echo '9cadaceaa89379aca18e593627a8a1d5dc63f4c3560895bafd0cac2279c9d5ad  public/images/skp-build-hero.png' | sha256sum -c -
          test "$(file --mime-type -b public/images/skp-build-hero.png)" = 'image/png'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/skp-build-hero.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add owner-supplied transparent SKP build hero photo'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
